<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EgeCraft</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:system-ui,sans-serif;color:#fff;text-align:center;padding:20px;background:linear-gradient(#4a90d9 0%,#87ceeb 55%,#3a8f2e 55%,#5b3a1a 100%)}
h1{font-size:52px;margin:0 0 10px;text-shadow:4px 4px #0006;letter-spacing:2px}
.btn{width:260px;padding:14px;font-size:20px;font-weight:700;color:#fff;background:#6b6b6b;border:3px solid #000;border-radius:6px;box-shadow:inset 0 -5px #444,inset 0 5px #9a9a9a;cursor:pointer}
.btn:active{background:#4f8f3a}
#panel{display:none;background:#000a;border-radius:10px;padding:16px;max-width:300px;font-size:16px}
</style>
</head>
<body>
<h1>🌍 EgeCraft</h1>
<button class="btn" onclick="goster('Oyun çok yakında geliyor! 🚧')">Oyna</button>
<button class="btn" onclick="goster('Ayarlar çok yakında!')">Ayarlar</button>
<button class="btn" onclick="goster('EgeCraft — blok dünyası oyunu. Hazırlanıyor.')">Hakkında</button>
<div id="panel"></div>
<script>
function goster(t){var p=document.getElementById('panel');p.textContent=t;p.style.display='block'}
</script>
</body>
</html>
